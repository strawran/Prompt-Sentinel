[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-sentinel"
version = "0.1.0"
description = "Local-first prompt injection inspection gateway and audit dashboard for text-based LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pandas>=2,<3",
  "PyYAML>=6,<7",
  "sentence-transformers>=3,<6",
  "streamlit>=1.39,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["prompt_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
